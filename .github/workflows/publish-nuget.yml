# Publishes the Posseth.NamedArguments.AnalyzerAndFixer NuGet package to nuget.org.
#
# Triggers:
#   - Pushing a version tag (v* or V*) -> builds, runs the tests and publishes automatically.
#   - Manual run from the Actions tab   -> optional version / suffix / dry-run inputs.
#
# Required repository secret: NUGET_API_KEY (your nuget.org API key).
# To configure it: repository Settings -> Secrets and variables -> Actions -> New repository secret.
name: Publish to NuGet

'on':
  push:
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to publish (e.g. 1.3.0). Defaults to the git tag without the v prefix.'
        required: false
        type: string
      suffix:
        description: 'Optional prerelease suffix (e.g. beta1 or -rc.1) appended to the version.'
        required: false
        type: string
      dry-run:
        description: 'Build, test and validate the package without pushing to NuGet.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  PACKAGE_PROJECT: src/Posseth.NamedArguments.AnalyzerAndFixer.Package/Posseth.NamedArguments.AnalyzerAndFixer.Package.csproj
  TEST_PROJECT: tests/Posseth.NamedArguments.AnalyzerAndFixer.Test/Posseth.NamedArguments.AnalyzerAndFixer.Test.csproj
  OUTPUT_DIR: artifacts
  NUGET_SOURCE: https://api.nuget.org/v3/index.json
  NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

jobs:
  publish:
    name: Build, test and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve package version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SUFFIX: ${{ inputs.suffix }}
        run: |
          VERSION="${INPUT_VERSION}"
          if [ -z "${VERSION}" ]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"   # v1.3.0 -> 1.3.0
            VERSION="${VERSION#V}" # V1.3.0 -> 1.3.0
            VERSION="${VERSION#.}" # V.1.1.8 -> 1.1.8
          fi
          if [ -z "${VERSION}" ]; then
            echo "::error::Could not determine a package version. Push a vX.Y.Z tag or provide the 'version' input."
            exit 1
          fi
          SUFFIX="${INPUT_SUFFIX}"
          if [ -n "${SUFFIX}" ]; then
            case "${SUFFIX}" in
              -*|.*) ;;
              *) SUFFIX="-${SUFFIX}" ;;
            esac
            VERSION="${VERSION}${SUFFIX}"
          fi
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z]+)*$ ]]; then
            echo "::error::Invalid semantic version '${VERSION}'. Expected e.g. 1.3.0 or 1.3.0-beta1."
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Publishing version: ${VERSION}"

      - name: Pack NuGet package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet pack "${PACKAGE_PROJECT}" -c Release -o "${OUTPUT_DIR}" \
            -p:Version="${VERSION}" \
            -p:PackageVersion="${VERSION}" \
            -p:ContinuousIntegrationBuild=true

      - name: Run tests
        shell: bash
        run: dotnet test "${TEST_PROJECT}" -c Release --nologo

      - name: Verify package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PACKAGE="${OUTPUT_DIR}/Posseth.NamedArguments.AnalyzerAndFixer.${VERSION}.nupkg"
          if [ ! -f "${PACKAGE}" ]; then
            echo "::error::Package not found at ${PACKAGE}"
            exit 1
          fi
          echo "Package ready: ${PACKAGE}"

      - name: Push to nuget.org
        if: ${{ !inputs.dry-run && env.NUGET_API_KEY != '' }}
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet nuget push "${OUTPUT_DIR}/Posseth.NamedArguments.AnalyzerAndFixer.${VERSION}.nupkg" \
            --api-key "${NUGET_API_KEY}" \
            --source "${NUGET_SOURCE}" \
            --skip-duplicate

      - name: Show dry-run result
        if: ${{ inputs.dry-run }}
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ls -la "${OUTPUT_DIR}/Posseth.NamedArguments.AnalyzerAndFixer.${VERSION}.nupkg"
          echo "Dry run finished - nothing was pushed to ${NUGET_SOURCE}."

      - name: Fail when NUGET_API_KEY secret is missing
        if: ${{ !inputs.dry-run && env.NUGET_API_KEY == '' }}
        shell: bash
        run: |
          echo "::error::The 'NUGET_API_KEY' secret is not configured. Add it under GitHub repository Settings -> Secrets and variables -> Actions."
          exit 1
